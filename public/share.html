<!DOCTYPE html><html><head><title>Shared Preview</title>
<script src="firebase-config.js"></script></head>
<body style="margin:0;">
<iframe id="f" style="width:100vw;height:100vh;border:none;display:none;"></iframe>
<div id="msg" style="font-family:sans-serif;padding:24px;"></div>
<script type="module">
const id = new URLSearchParams(location.search).get("id");
const {initializeApp} = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
const {getFirestore,doc,onSnapshot} = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
const app = initializeApp(window.GLOBAL_FIREBASE_CONFIG);
const db = getFirestore(app);
const frame = document.getElementById("f");
const msg = document.getElementById("msg");

function showMessage(html){ frame.style.display="none"; msg.innerHTML = html; }
function render(files){
  const keys = Object.keys(files);
  let key = keys.find(k => k === "index.html");
  if(!key) key = keys.find(k => k.toLowerCase() === "index.html");
  if(!key) key = keys.find(k => k.toLowerCase().endsWith("/index.html"));
  if(!key) key = keys.find(k => k.toLowerCase().endsWith(".html"));

  if(key){
    msg.innerHTML = "";
    frame.style.display = "block";
    frame.srcdoc = files[key];
  } else if(keys.length){
    const list = keys.map(k => `<li><code>${k}</code></li>`).join("");
    showMessage(`<h2>No HTML file found in this share</h2>
      <p>This project doesn't contain an index.html. Files included:</p>
      <ul>${list}</ul>`);
  } else {
    showMessage("<h2>This share is empty.</h2>");
  }
}

if(!id){
  showMessage("<h2>No share id given.</h2>");
} else {
  onSnapshot(doc(db,"shares",id), snap => {
    if(snap.exists()) render(snap.data().files || {});
    else showMessage("<h2>Share not found or expired.</h2>");
  }, () => showMessage("<h2>Couldn't load this share.</h2>"));
}
</script></body></html>
